# Local development stack. Credentials come from .env (git-ignored; copy .env.example).
# Start order: postgres (healthy) -> migrate (completed successfully) -> api (healthy) -> frontend.
# Browser -> frontend (nginx, :8080) -> /api/* -> api (:8080 in the network) -> postgres.

name: taskflow

x-api-image: &api-image
  # Same image for the service and its migrations (ADR-0004). Built locally, tagged by git SHA.
  image: taskflow-api:${API_TAG:-dev}
  build:
    context: ./api
    args:
      VERSION: ${API_TAG:-dev}
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}?sslmode=disable
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Check over TCP, not the Unix socket: on first boot the image runs a temporary init server
      # that listens on the socket only (listen_addresses=''), then stops it. A socket check can
      # report that short-lived server as healthy and let `migrate` start against a stopping database.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # No published port: only services on the compose network reach the database.

  migrate:
    <<: *api-image
    command: ["migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    command: ["serve"]
    ports:
      # Published only for local debugging (/metrics, /readyz); users go through the frontend.
      - "127.0.0.1:${API_PORT:-8081}:8080"
    # DRAIN_DELAY (5s) + SHUTDOWN_TIMEOUT (15s) must fit before Docker sends SIGKILL.
    stop_grace_period: 25s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: taskflow-frontend:${API_TAG:-dev}
    build:
      context: ./frontend
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    # Not required for nginx to start (it resolves the API per request); it only avoids 502s right after `up`.
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
