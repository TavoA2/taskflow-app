# Application CI: static checks, tests, image build, vulnerability gate and SBOM on every pull request
# and on every push to main. Each check calls a Makefile target, so any failure reproduces locally with
# the same command. On main only, the scanned images are published to GHCR (tagged by commit SHA, never
# `latest`) with signed build provenance and SBOM attestations.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the GITHUB_TOKEN can only read the repository. Jobs that need more ask for it.
permissions:
  contents: read

# A new push to the same PR cancels the run in progress; runs on main always complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved to different code; a SHA cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # the secrets scan reads the whole history
          persist-credentials: false # later steps never need the token in .git/config
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Format and vet
        run: make fmt vet
      - name: Lint (golangci-lint, hadolint, shellcheck, actionlint)
        run: make lint
      # Runs even if an earlier step failed: a lint error must not hide a leaked secret.
      - name: Secrets scan (full git history)
        if: ${{ !cancelled() }}
        run: make secrets-scan

  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Unit and integration tests with the race detector
        run: make test-race

  build-scan:
    name: build and scan
    needs: [lint, test] # never spend time scanning code that does not pass lint and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Go vulnerabilities in reachable code (govulncheck)
        run: make vulncheck
      - name: Build images
        run: make images
      # The vulnerability DB is ~100 MB and changes daily: one cache entry per day.
      - name: Cache key for the Trivy DB
        id: trivy-key
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-key.outputs.date }}
          restore-keys: trivy-db-
      - name: Vulnerability report and CVE gate (Trivy)
        run: make scan
      # SBOMs are produced even when the gate fails: the inventory helps to triage the finding.
      - name: SBOM (CycloneDX)
        if: ${{ !cancelled() }}
        run: make sbom
      # On pull_request events github.sha is GitHub's temporary merge commit (PR branch + main), which
      # exists in no branch; name the artifact after the PR head commit so it maps to real history.
      # The images themselves are built from that merge commit: what main would contain after merging.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sbom-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/*.cdx.json
          if-no-files-found: error
          retention-days: 30
      # Main only: hand the exact images that passed the gate to the publish job. Rebuilding there
      # would publish bytes that never went through the CVE gate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: images-${{ github.sha }}
          path: build/*.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish (${{ matrix.image }})
    # Pushes to main only, after every gate passed. Pull requests never get these write permissions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-scan]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      # Each image must finish push + both attestations on its own. With fail-fast, one image failing
      # cancels the other mid-run, which can leave a pushed image without attestations.
      fail-fast: false
      matrix:
        image: [api, frontend]
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      id-token: write          # OIDC token for keyless (Sigstore) signing of the attestations
      attestations: write      # store the attestations in GitHub
      artifact-metadata: write # storage record linking each attestation to the package
    env:
      IMAGE: ghcr.io/tavoa2/taskflow-${{ matrix.image }} # GHCR requires a lowercase owner
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-${{ github.sha }}
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ github.sha }}
          path: build
      # Values from the event go through env vars, never interpolated into the script (injection-safe).
      - name: Load, check revision, tag by commit SHA and push
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          NAME: ${{ matrix.image }}
        run: |
          local_ref=$(docker load -i "build/$NAME.tar" | sed -n 's/^Loaded image: //p')
          revision=$(docker image inspect "$local_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          if [ "$revision" != "$SHA" ]; then
            echo "::error::image label revision=$revision does not match commit $SHA"; exit 1
          fi
          docker tag "$local_ref" "$IMAGE:$SHA"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push --quiet "$IMAGE:$SHA"
          digest=$(docker image inspect "$IMAGE:$SHA" --format '{{ range .RepoDigests }}{{ println . }}{{ end }}' | grep "^$IMAGE@" | cut -d@ -f2)
          [ -n "$digest" ] || { echo "::error::no registry digest for $IMAGE:$SHA"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          { echo "### \`$IMAGE:$SHA\`"; echo "digest: \`$digest\`"; } >> "$GITHUB_STEP_SUMMARY"
      # No sbom-path or predicate: generates SLSA build provenance (repo, commit, workflow, runner).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: build/${{ matrix.image }}.cdx.json
          push-to-registry: true
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
